
name: Build KM Music APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip KM-Music-project-final.zip
          cd Metrolist-main
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KM-Music-APK
          path: Metrolist-main/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

